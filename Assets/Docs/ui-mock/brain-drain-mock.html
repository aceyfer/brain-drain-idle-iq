<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brain Drain — First Playable Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0D0A14; --panel:#181226; --panel2:#221A38; --line:#3A2E5C;
    --bp:#00F0FF; --cash:#7CFF3B; --rp:#FF3DB4; --warn:#FFB020;
    --ink:#EFEAFF; --dim:#8B84A3;
    --disp:'Bungee',cursive; --body:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#050308;font-family:var(--body);color:var(--ink);overflow:hidden}

  /* Phone frame: full-bleed on mobile, framed on desktop */
  #frame{position:relative;margin:0 auto;height:100%;width:100%;max-width:430px;background:var(--void);overflow:hidden;display:flex;flex-direction:column;user-select:none}
  @media(min-width:500px){
    body{display:flex;align-items:center;justify-content:center}
    #frame{height:min(96vh,860px);border-radius:36px;border:6px solid #1c1c22;box-shadow:0 0 80px rgba(0,240,255,.12),0 30px 60px rgba(0,0,0,.7)}
  }

  /* ---------- HUD ---------- */
  #hud{padding:14px 14px 8px;background:linear-gradient(180deg,rgba(13,10,20,.95),rgba(13,10,20,.75) 70%,transparent);z-index:5}
  #titleRow{display:flex;justify-content:space-between;align-items:baseline}
  #iq{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--warn);letter-spacing:.5px}
  #snottTitle{font-family:var(--disp);font-size:11px;color:var(--rp);text-shadow:0 0 8px rgba(255,61,180,.6);letter-spacing:1px}
  #bpBig{font-family:var(--mono);font-weight:700;font-size:30px;color:var(--bp);text-shadow:0 0 14px rgba(0,240,255,.55);text-align:center;margin:2px 0 0;line-height:1.1}
  #bpLabel{font-family:var(--disp);font-size:9px;color:var(--dim);text-align:center;letter-spacing:2px}
  #subRow{display:flex;justify-content:center;gap:14px;margin-top:6px;font-family:var(--mono);font-size:11px;font-weight:500}
  #subRow .cash{color:var(--cash)} #subRow .rp{color:var(--rp)} #subRow .bpps{color:var(--dim)}

  /* ---------- WORLD ---------- */
  #world{position:relative;flex:1;overflow:hidden}
  #sky{position:absolute;inset:0;transition:background 1.2s ease}
  #smog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(90,60,20,.45),rgba(40,20,50,.55));transition:opacity 1.2s ease;pointer-events:none}
  #stars{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none;
    background-image:radial-gradient(1.5px 1.5px at 20% 25%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 40%,#9ff,transparent),radial-gradient(1px 1px at 85% 35%,#fff,transparent)}
  .bld{position:absolute;bottom:26%;background:linear-gradient(180deg,#241B3A,#120D20);box-shadow:inset 0 0 0 1px rgba(0,240,255,.06)}
  .bld i{position:absolute;background:var(--warn);opacity:.5;width:8%;height:3%;box-shadow:0 0 6px rgba(255,176,32,.8)}
  .neonSign{position:absolute;font-family:var(--disp);font-size:8px;letter-spacing:1px;transform:rotate(-4deg)}
  #trash{position:absolute;left:0;right:0;bottom:24%;text-align:center;font-size:26px;letter-spacing:-6px;transition:opacity 1s ease,transform 1s ease;filter:saturate(.7)}
  #street{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#171126,#0B0714);border-top:1px solid var(--line)}
  .ped{position:absolute;bottom:8%;font-size:22px;filter:grayscale(.5) brightness(.8);animation:walk linear infinite}
  @keyframes walk{from{transform:translateX(-40px)}to{transform:translateX(460px)}}
  #stageTag{position:absolute;top:8px;left:12px;font-family:var(--disp);font-size:9px;color:var(--dim);letter-spacing:1px;background:rgba(13,10,20,.6);padding:4px 8px;border:1px solid var(--line);border-radius:4px}

  /* ---------- BRAIN (tap target) ---------- */
  #brainWrap{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4}
  #brain{font-size:96px;line-height:1;cursor:pointer;display:block;
    filter:drop-shadow(0 0 18px rgba(255,61,180,.65)) drop-shadow(0 0 40px rgba(0,240,255,.35));
    transition:transform .08s ease;animation:idlePulse 2.6s ease-in-out infinite}
  #brain.punch{transform:scale(.82) rotate(-4deg)}
  @keyframes idlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  #tapHint{font-family:var(--disp);font-size:9px;color:var(--dim);text-align:center;letter-spacing:2px;margin-top:6px}

  .float{position:absolute;font-family:var(--mono);font-weight:700;color:var(--bp);text-shadow:0 0 10px rgba(0,240,255,.8);pointer-events:none;animation:rise .9s ease-out forwards;z-index:6;font-size:16px}
  @keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
  .splat{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--rp);pointer-events:none;animation:splat .5s ease-out forwards;z-index:5}
  @keyframes splat{from{opacity:.9;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

  /* ---------- COGS bubble ---------- */
  #cogs{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:10px;align-items:flex-end;opacity:0;transform:translateY(14px);transition:all .35s ease;pointer-events:none;z-index:7}
  #cogs.show{opacity:1;transform:translateY(0)}
  #cogsFace{font-size:34px;filter:drop-shadow(0 0 8px rgba(0,240,255,.5))}
  #cogsBubble{background:rgba(24,18,38,.96);border:1px solid var(--bp);border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;box-shadow:0 0 20px rgba(0,240,255,.15);max-width:85%}
  #cogsName{font-family:var(--disp);font-size:8px;color:var(--bp);letter-spacing:2px;display:block;margin-bottom:3px}

  /* ---------- BOTTOM BAR ---------- */
  #bar{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:5}
  .barBtn{flex:1;font-family:var(--disp);font-size:12px;letter-spacing:1px;padding:13px 4px;border-radius:10px;border:1px solid;background:transparent;color:var(--ink);cursor:pointer;transition:transform .06s ease,box-shadow .2s}
  .barBtn:active{transform:scale(.95)}
  #shopBtn{border-color:var(--bp);color:var(--bp);box-shadow:0 0 12px rgba(0,240,255,.15)}
  #convertBtn{border-color:var(--cash);color:var(--cash)}
  #restoreBtn{border-color:var(--rp);color:var(--rp)}

  /* ---------- SHOP PANEL ---------- */
  #shade{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
  #shade.on{opacity:1;pointer-events:auto}
  #shop{position:absolute;left:0;right:0;bottom:0;height:64%;background:var(--panel);border-top:2px solid var(--bp);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:9;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,240,255,.12)}
  #shop.open{transform:translateY(0)}
  #shopHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  #shopHead h2{font-family:var(--disp);font-size:14px;letter-spacing:1px}
  #closeShop{font-family:var(--disp);font-size:12px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 14px;cursor:pointer}
  #tabs{display:flex;gap:6px;padding:0 12px}
  .tab{flex:1;font-family:var(--disp);font-size:10px;letter-spacing:.5px;padding:11px 2px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--void);color:var(--dim);cursor:pointer}
  .tab.active[data-t="bp"]{color:var(--bp);border-color:var(--bp);background:var(--panel2)}
  .tab.active[data-t="cash"]{color:var(--cash);border-color:var(--cash);background:var(--panel2)}
  .tab.active[data-t="rp"]{color:var(--rp);border-color:var(--rp);background:var(--panel2)}
  #items{flex:1;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:var(--panel2);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .item .ic{font-size:26px;width:36px;text-align:center}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:700;font-size:14px}
  .item .fx{font-size:11.5px;color:var(--dim);line-height:1.3}
  .buy{font-family:var(--mono);font-weight:700;font-size:11.5px;border-radius:9px;padding:10px 10px;min-width:92px;cursor:pointer;border:1px solid;background:transparent;text-align:center;line-height:1.25}
  .buy .lvl{display:block;font-size:9px;opacity:.7}
  .buy.ok-bp{color:var(--void);background:var(--bp);border-color:var(--bp);box-shadow:0 0 12px rgba(0,240,255,.4)}
  .buy.ok-cash{color:var(--void);background:var(--cash);border-color:var(--cash);box-shadow:0 0 12px rgba(124,255,59,.4)}
  .buy.ok-rp{color:var(--void);background:var(--rp);border-color:var(--rp);box-shadow:0 0 12px rgba(255,61,180,.4)}
  .buy.no{color:var(--dim);border-color:var(--line)}
  .buy.locked{color:var(--warn);border-color:var(--warn);opacity:.75}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="frame">

  <div id="hud">
    <div id="titleRow"><span id="iq">IQ: 100</span><span id="snottTitle">SNOTTY ROOKIE</span></div>
    <div id="bpBig">0</div>
    <div id="bpLabel">BRAIN POWER</div>
    <div id="subRow">
      <span class="bpps"><span id="bpps">0.0</span>/s</span>
      <span class="cash">$<span id="cash">0</span></span>
      <span class="rp"><span id="rp">0</span> RP</span>
    </div>
  </div>

  <div id="world">
    <div id="sky"></div><div id="stars"></div>
    <div class="bld" style="left:4%;width:16%;height:34%"><i style="left:15%;top:12%"></i><i style="left:60%;top:30%"></i><i style="left:30%;top:55%"></i></div>
    <div class="bld" style="left:24%;width:13%;height:46%"><i style="left:20%;top:10%"></i><i style="left:55%;top:40%"></i></div>
    <div class="bld" style="right:22%;width:18%;height:40%"><i style="left:25%;top:20%"></i><i style="left:60%;top:50%"></i><i style="left:15%;top:70%"></i></div>
    <div class="bld" style="right:3%;width:14%;height:52%"><i style="left:30%;top:15%"></i><i style="left:55%;top:35%"></i></div>
    <div class="neonSign" style="right:5%;top:18%;color:var(--rp);text-shadow:0 0 8px var(--rp)">BRAWNDO™</div>
    <div class="neonSign" style="left:6%;top:34%;color:var(--bp);text-shadow:0 0 8px var(--bp)">SNOTT CO.</div>
    <div id="smog"></div>
    <div id="trash">🗑️🛞📦🗑️💩📺🗑️🛒🗑️</div>
    <div id="street"></div>
    <div class="ped" style="animation-duration:16s;animation-delay:0s">🧟</div>
    <div class="ped" style="animation-duration:22s;animation-delay:4s;bottom:12%">🧟‍♀️</div>
    <div class="ped" style="animation-duration:19s;animation-delay:9s;bottom:5%">🧟</div>
    <div id="stageTag">STAGE 1 · TOXIC WASTELAND</div>
    <div id="brainWrap">
      <span id="brain">🧠</span>
      <div id="tapHint">TAP TO HARVEST</div>
    </div>
    <div id="cogs"><span id="cogsFace">🤖</span><div id="cogsBubble"><span id="cogsName">COGS</span><span id="cogsLine"></span></div></div>
  </div>

  <div id="bar">
    <button class="barBtn" id="shopBtn">SHOP</button>
    <button class="barBtn" id="convertBtn">CONVERT</button>
    <button class="barBtn" id="restoreBtn">RESTORE</button>
  </div>

  <div id="shade"></div>
  <div id="shop">
    <div id="shopHead"><h2 id="shopTitle">BP STORE</h2><button id="closeShop">✕</button></div>
    <div id="tabs">
      <button class="tab active" data-t="bp">🧠 BP STORE</button>
      <button class="tab" data-t="cash">💵 CASH STORE</button>
      <button class="tab" data-t="rp">✨ RP STORE</button>
    </div>
    <div id="items"></div>
  </div>
</div>

<script>
// ---------- toy economy (feel-test numbers, NOT real balance) ----------
const S={bp:0,cum:0,cash:0,rp:0,iq:100,tapMult:1,bpps:0,cps:0,restSpent:0,stage:0};
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n);

const BUILD=[
 {ic:'📚',nm:'The Literal Library',fx:'+0.5 BP/s. Books, unread.',cost:15,mult:1.25,bpps:.5,lvl:0,unlock:0},
 {ic:'📱',nm:'Doomscroll Engine',fx:'+1 BP/s. Infinite feed, zero thoughts.',cost:10,mult:1.21,bpps:1,lvl:0,unlock:0},
 {ic:'🕳️',nm:'Underground Economy',fx:'+$2/s. Don\u2019t ask.',cost:75,mult:1.38,cps:2,lvl:0,unlock:100},
 {ic:'🎙️',nm:'Podcaster Soundboard',fx:'+8 BP/s. "So basically\u2026"',cost:150,mult:1.21,bpps:8,lvl:0,unlock:800},
 {ic:'🪙',nm:'Crypto Bro Compound',fx:'+40 BP/s, +$5/s. Trust me bro.',cost:1200,mult:1.32,bpps:40,cps:5,lvl:0,unlock:5000},
];
const CASHSHOP=[
 {ic:'👑',nm:'Golden Cardboard Crown',fx:'+25% tap power. Recycled majesty.',cost:100,owned:false,eff:()=>S.tapMult*=1.25},
 {ic:'🐕',nm:'Shivering Designer Micro-Dog',fx:'+15% BP/s. It judges you.',cost:400,owned:false,eff:()=>{S.bpps*=1.15}},
 {ic:'👟',nm:'Overpriced Branded Sneakers',fx:'+50% tap power. Never worn outside.',cost:1500,owned:false,eff:()=>S.tapMult*=1.5},
 {ic:'🛋️',nm:'Solid Gold Gaming Throne',fx:'+30% everything. Lumbar support optional.',cost:6000,owned:false,eff:()=>{S.tapMult*=1.3;S.bpps*=1.3;S.cps*=1.3}},
];
const RPSHOP=[
 {ic:'🧹',nm:'Street Sweeper Militia',fx:'Restore the world. +10 RP spent.',cost:10,rest:10},
 {ic:'🌱',nm:'Guerrilla Gardeners',fx:'Restore the world. +50 RP spent.',cost:50,rest:50},
 {ic:'🏫',nm:'Reopen One (1) School',fx:'Restore the world. +200 RP spent.',cost:200,rest:200},
 {ic:'🕊️',nm:'The Grand De-Snotting',fx:'Restore the world. +1000 RP spent.',cost:1000,rest:1000},
];
const STAGES=[
 {n:'STAGE 1 · TOXIC WASTELAND',at:0,sky:'linear-gradient(180deg,#2A1608,#3A1A2E 60%,#1A0F24)',smog:.95,trash:1},
 {n:'STAGE 2 · SLIGHTLY LESS GROSS',at:60,sky:'linear-gradient(180deg,#33200F,#3E2340 60%,#1C1128)',smog:.7,trash:.8},
 {n:'STAGE 3 · FUNCTIONING SOCIETY?',at:250,sky:'linear-gradient(180deg,#2B2440,#3A2E5C 60%,#201640)',smog:.45,trash:.55},
 {n:'STAGE 4 · CAUTIOUS OPTIMISM',at:800,sky:'linear-gradient(180deg,#232B52,#33346B 60%,#1E1A44)',smog:.25,trash:.3},
 {n:'STAGE 5 · NEON RENAISSANCE',at:2500,sky:'linear-gradient(180deg,#1B2E63,#2C3E86 60%,#1B2152)',smog:.1,trash:.1},
 {n:'STAGE 6 · UTOPIA ACHIEVED',at:6000,sky:'linear-gradient(180deg,#14346E,#2C55A8 55%,#1C2A66)',smog:0,trash:0},
];
const LINES={
 tap:['Yes. Squeeze the populace. Gently.','Their thoughts are… negotiable.','Another synapse in the jar. Lovely.'],
 buy:['Excellent purchase. The Illumisnotty are seething.','Money well wasted, boss.','Infrastructure! For evil!'],
 restore:['Wait — are you… HELPING people?','The streets look… clean? Disgusting. Continue.','I detect hope. Deploying countermeasures. Kidding. Mostly.'],
 stage:['The world is healing. This was not in my contract.','They\u2019re getting SMARTER. Abort? No? Fine.','Utopia detected. I feel… feelings?'],
};

// ---------- DOM ----------
const $=id=>document.getElementById(id);
const world=$('world'),brain=$('brain'),items=$('items');
let tab='bp';

function say(pool){
  const b=$('cogs');$('cogsLine').textContent=LINES[pool][Math.floor(Math.random()*LINES[pool].length)];
  b.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>b.classList.remove('show'),2600);
}
function floatText(x,y,txt,color){
  const f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(x-20)+'px';f.style.top=(y-30)+'px';if(color)f.style.color=color,f.style.textShadow='0 0 10px '+color;
  world.appendChild(f);setTimeout(()=>f.remove(),900);
}
function splats(x,y){
  for(let i=0;i<6;i++){const s=document.createElement('div');s.className='splat';
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--dy',(Math.random()*-60-10)+'px');
    world.appendChild(s);setTimeout(()=>s.remove(),520);}
}
function doTap(e){
  const r=world.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left, y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const gain=Math.max(1,Math.round(1*S.tapMult));
  S.bp+=gain;S.cum+=gain;S.iq+=0.01;
  floatText(x,y,'+'+fmt(gain));splats(x,y);
  brain.classList.add('punch');setTimeout(()=>brain.classList.remove('punch'),80);
  if(navigator.vibrate)navigator.vibrate(8);
  if(Math.random()<0.04)say('tap');
  paint();
}
brain.addEventListener('pointerdown',doTap);

// ---------- shop ----------
function renderShop(){
  $('shopTitle').textContent=tab==='bp'?'BP STORE':tab==='cash'?'CASH STORE':'RP STORE';
  items.innerHTML='';
  const list=tab==='bp'?BUILD:tab==='cash'?CASHSHOP:RPSHOP;
  list.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item';
    let btn='';
    if(tab==='bp'){
      const cost=Math.round(it.cost*Math.pow(it.mult,it.lvl));
      if(S.cum<it.unlock)btn=`<button class="buy locked">🔒 ${fmt(it.unlock)} BP<span class="lvl">CUMULATIVE</span></button>`;
      else btn=`<button class="buy ${S.bp>=cost?'ok-bp':'no'}" data-i="${i}">${fmt(cost)} BP<span class="lvl">LVL ${it.lvl}</span></button>`;
      row.innerHTML=`<div class="ic">${it.ic}</div><div class="info"><div class="nm">${S.cum<it.unlock?'??? CLASSIFIED ???':it.nm}</div><div class="fx">${S.cum<it.unlock?'Keep harvesting.':it.fx}</div></div>${btn}`;
    }else if(tab==='cash'){
      btn=it.owned?`<button class="buy no">OWNED</button>`:`<button class="buy ${S.cash>=it.cost?'ok-cash':'no'}" data-i="${i}">$${fmt(it.cost)}</button>`;
      row.innerHTML=`<div class="ic">${it.ic}</div><div class="info"><div class="nm">${it.nm}</div><div class="fx">${it.fx}</div></div>${btn}`;
    }else{
      btn=`<button class="buy ${S.rp>=it.cost?'ok-rp':'no'}" data-i="${i}">${fmt(it.cost)} RP</button>`;
      row.innerHTML=`<div class="ic">${it.ic}</div><div class="info"><div class="nm">${it.nm}</div><div class="fx">${it.fx}</div></div>${btn}`;
    }
    items.appendChild(row);
  });
}
items.addEventListener('click',e=>{
  const b=e.target.closest('.buy');if(!b||b.dataset.i===undefined||b.classList.contains('no')||b.classList.contains('locked'))return;
  const i=+b.dataset.i;
  if(tab==='bp'){const it=BUILD[i];const cost=Math.round(it.cost*Math.pow(it.mult,it.lvl));
    if(S.bp<cost)return;S.bp-=cost;it.lvl++;S.iq+=1;
    if(it.bpps)S.bpps+=it.bpps;if(it.cps)S.cps+=it.cps;say('buy');}
  else if(tab==='cash'){const it=CASHSHOP[i];if(S.cash<it.cost||it.owned)return;S.cash-=it.cost;it.owned=true;it.eff();say('buy');}
  else{const it=RPSHOP[i];if(S.rp<it.cost)return;S.rp-=it.cost;S.restSpent+=it.rest;say('restore');applyStage();}
  renderShop();paint();
});
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
  tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));renderShop();});
$('shopBtn').onclick=()=>{$('shop').classList.add('open');$('shade').classList.add('on');renderShop();};
$('closeShop').onclick=$('shade').onclick=()=>{$('shop').classList.remove('open');$('shade').classList.remove('on');};

// ---------- convert / restore ----------
$('convertBtn').onclick=()=>{if(S.cash<1)return say('tap');
  const got=Math.floor(S.cash*0.5);S.rp+=got;floatText(world.clientWidth/2,world.clientHeight*0.6,'+'+fmt(got)+' RP','#FF3DB4');S.cash=0;paint();};
$('restoreBtn').onclick=()=>{if(S.rp<1)return;S.restSpent+=S.rp;floatText(world.clientWidth/2,world.clientHeight*0.5,'WORLD +'+fmt(S.rp),'#FF3DB4');S.rp=0;say('restore');applyStage();paint();};

function applyStage(){
  let idx=0;STAGES.forEach((st,i)=>{if(S.restSpent>=st.at)idx=i;});
  if(idx!==S.stage){S.stage=idx;say('stage');}
  const st=STAGES[idx];
  $('sky').style.background=st.sky;$('smog').style.opacity=st.smog;$('stars').style.opacity=idx>=3?0.8:0;
  $('trash').style.opacity=st.trash;$('trash').style.transform=`translateY(${(1-st.trash)*20}px)`;
  $('stageTag').textContent=st.n;
  document.querySelectorAll('.ped').forEach(p=>{p.style.filter=`grayscale(${Math.max(0,.5-idx*.1)}) brightness(${.8+idx*.06})`;
    p.textContent=idx>=4?'🚶':idx>=2?'🧍':p.textContent;});
}

// ---------- tick & paint ----------
setInterval(()=>{S.bp+=S.bpps;S.cum+=S.bpps;S.cash+=S.cps;paint();},1000);
function paint(){
  $('bpBig').textContent=fmt(S.bp);$('bpps').textContent=S.bpps.toFixed(1);
  $('cash').textContent=fmt(S.cash);$('rp').textContent=fmt(S.rp);
  $('iq').textContent='IQ: '+Math.floor(S.iq);
  if($('shop').classList.contains('open'))renderShop();
}
applyStage();paint();
setTimeout(()=>say('tap'),1500);
</script>
</body>
</html>
